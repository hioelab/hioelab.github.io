title: Operations & Experience Lab
description: Hongik University — Operations & Experience Lab
url: "https://www.hioelab.com"
# 사이트가 https://hioelab.github.io 처럼 "루트"에 올라가면 아래는 빈 칸 그대로 두세요.
# 만약 저장소 이름이 hioelab.github.io 가 아니라면(예: github.io-),
# baseurl 을 "/저장소이름" 으로 바꾸세요. 예: baseurl: "/github.io-"
baseurl: ""
# 사이트 시간대. GitHub Pages는 UTC로 빌드하므로 이 설정이 없으면
# '2026-08-16 00:00 +0900' 같은 글 날짜가 8월 15일로 밀려 주소·표시 날짜가 하루 어긋납니다.
timezone: Asia/Seoul

# 검색엔진 최적화(SEO) 설정
lang: ko
author: Seungbeom Kim
og_image: /assets/img/og-cover-v2.png

plugins:
  - jekyll-sitemap

# 언어별 주소 분리 — 기본 주소(/...)는 한국어, 영어는 /en/... 로 나갑니다.
#  - en/ 폴더의 페이지들은 한국어 페이지와 같은 본문(_includes/*.html)을 공유합니다.
#  - 블로그·뉴스 글은 _en_posts/ 폴더에 "같은 파일명의 빈 파일"을 두면
#    /en/blog/... 주소가 자동으로 생기고 본문은 _posts 의 원문을 그대로 씁니다.
collections:
  en_posts:
    output: true
    permalink: /en/blog/:year/:month/:day/:title/

# 글 날짜에 시:분:초를 넣어 목록 순서를 조정하는 경우, 빌드 시점보다
# 늦은 시각이면 Jekyll이 "미래 글"로 보고 숨길 수 있어 항상 표시되게 함.
future: true
defaults:
  - scope:
      path: ""
    values:
      locale: ko
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:year/:month/:day/:title/
  - scope:
      path: ""
      type: en_posts
    values:
      layout: post
      locale: en
  - scope:
      path: "en"
    values:
      locale: en
# 빌드에서 제외할 파일(웹사이트엔 안 나옴, 폴더엔 남음)
exclude:
  - "GitHub_Pages_배포가이드.md"
  - "블로그_사용법.md"
  - "README.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "인수인계.md"
  - "연구원_인수인계_Claude용.md"
  - "AGENTS.md"
  - "*.tmp.*"
  - "김승범 1.jpg"
