title: Operations & Experience Lab
description: Hongik University — Operations & Experience Lab
url: "https://hioelab.github.io"
# 사이트가 https://hioelab.github.io 처럼 "루트"에 올라가면 아래는 빈 칸 그대로 두세요.
# 만약 저장소 이름이 hioelab.github.io 가 아니라면(예: github.io-),
# baseurl 을 "/저장소이름" 으로 바꾸세요. 예: baseurl: "/github.io-"
baseurl: ""
# 검색엔진 최적화(SEO) 설정
lang: ko
author: Seungbeom Kim
og_image: /assets/img/og-cover-v2.png

plugins:
  - jekyll-sitemap

# 글 날짜에 시:분:초를 넣어 목록 순서를 조정하는 경우, 빌드 시점보다
# 늦은 시각이면 Jekyll이 "미래 글"로 보고 숨길 수 있어 항상 표시되게 함.
future: true
defaults:
  - scope:
      path: ""
      type: posts
    values:
      permalink: /blog/:year/:month/:day/:title/
# 빌드에서 제외할 파일(웹사이트엔 안 나옴, 폴더엔 남음)
exclude:
  - "GitHub_Pages_배포가이드.md"
  - "블로그_사용법.md"
  - "README.md"
  - "Gemfile"
  - "Gemfile.lock"
  - "인수인계.md"
  - "연구원_인수인계_Claude용.md"
  - "AGENTS.md"
  - "*.tmp.*"
  - "김승범 1.jpg"
